<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #001b29 0%, #000811 40%, #000000 80%);
  color: #00eaff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.app {
  width: 94%;
  max-width: 520px;
  text-align: center;
  padding: 20px;
}

.logo {
  font-size: 54px;
  letter-spacing: 10px;
  margin-top: 5px;
  text-shadow:
    0 0 10px #00eaff,
    0 0 30px #00eaff,
    0 0 60px #008cff;
}

.status {
  font-size: 18px;
  margin-top: 8px;
  min-height: 28px;
  color: #9dfaff;
}

.hologram {
  width: 270px;
  height: 270px;
  margin: 30px auto;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.core {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle,
      white 0%,
      #00ffff 12%,
      #008cff 35%,
      #003bff 55%,
      transparent 75%
    );
  box-shadow:
    0 0 20px #00eaff,
    0 0 50px #008cff,
    0 0 100px #0066ff;
  animation: pulse 2s infinite;
}

.ring {
  position: absolute;
  border: 2px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 12px #00eaff;
}

.ring1 {
  width: 160px;
  height: 160px;
  animation: rotate 5s linear infinite;
}

.ring2 {
  width: 215px;
  height: 215px;
  border-style: dashed;
  animation: rotateReverse 8s linear infinite;
}

.ring3 {
  width: 265px;
  height: 265px;
  border-style: dotted;
  opacity: .6;
  animation: rotate 12s linear infinite;
}

.scan {
  position: absolute;
  width: 265px;
  height: 2px;
  background: #00eaff;
  box-shadow: 0 0 15px #00eaff;
  animation: scan 3s ease-in-out infinite;
}

.active .core {
  animation: pulse .6s infinite;
}

.output {
  min-height: 75px;
  border: 1px solid #00eaff;
  border-radius: 18px;
  padding: 20px;
  background: rgba(0, 20, 30, .7);
  box-shadow:
